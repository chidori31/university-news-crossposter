<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать публикацию</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
            color: #172033;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #0b3d91;
        }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 16px;
            font-size: 16px;
            line-height: 1.5;
            border: 1px solid #ccd6e5;
            border-radius: 12px;
            resize: vertical;
            box-sizing: border-box;
        }

        .platforms {
            display: flex;
            gap: 12px;
            margin: 18px 0;
            flex-wrap: wrap;
        }

        .platform {
            border: 1px solid #ccd6e5;
            padding: 12px 16px;
            border-radius: 12px;
            background: #f8fbff;
            cursor: pointer;
        }

        button {
            background: #0b63ce;
            color: white;
            border: none;
            padding: 14px 22px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
        }

        button:hover {
            background: #084fa6;
        }

        .results {
            margin-bottom: 20px;
        }

        .result {
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .success {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .warning {
            background: #fff8e1;
            color: #795548;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
        }

        .hint {
            color: #667085;
            font-size: 14px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Создать публикацию</h1>

        {% if results %}
            <div class="results">
                {% for result in results %}
                    <div class="result {{ result.type }}">
                        <b>{{ result.platform }}</b>: {{ result.message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        <form method="post" action="/create" enctype="multipart/form-data">
            <textarea name="text" placeholder="Вставь текст новости..." required>{{ text or "" }}</textarea>
            <div style="margin-top: 16px;">
                <label><b>Фото/видео к публикации:</b></label><br><br>
                <input type="file" name="media_files" multiple accept="image/*,video/*">
            </div>
            <div class="platforms">
                <label class="platform">
                    <input type="checkbox" name="platforms" value="telegram"
                        {% if not selected_platforms or "telegram" in selected_platforms %}checked{% endif %}>
                    Telegram
                </label>

                <label class="platform">
                    <input type="checkbox" name="platforms" value="max"
                        {% if "max" in selected_platforms %}checked{% endif %}>
                    MAX
                </label>

                <label class="platform">
                    <input type="checkbox" name="platforms" value="vk"
                        {% if "vk" in selected_platforms %}checked{% endif %}>
                    VK
                </label>
            </div>
            <div style="margin: 18px 0;">
                <label><b>Время публикации:</b></label><br><br>

                <label>
                    <input type="radio" name="publish_mode" value="now" checked>
                    Опубликовать сейчас
                </label>

                <br>

                <label>
                    <input type="radio" name="publish_mode" value="schedule">
                    Запланировать
                </label>

                <br><br>

                <input type="datetime-local" name="publish_at">
            </div>
            <button type="submit">Опубликовать</button>
        </form>

        <div class="hint">
            Сейчас реально работает Telegram. MAX и VK добавим следующими адаптерами.
        </div>
    </div>
</body>
</html>
