<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактировать публикацию</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
            color: #172033;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            background: white;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #0b3d91;
        }

        textarea {
            width: 100%;
            min-height: 260px;
            padding: 16px;
            font-size: 16px;
            line-height: 1.5;
            border: 1px solid #ccd6e5;
            border-radius: 12px;
            resize: vertical;
            box-sizing: border-box;
        }

        .platforms {
            display: flex;
            gap: 12px;
            margin: 18px 0;
            flex-wrap: wrap;
        }

        .platform {
            border: 1px solid #ccd6e5;
            padding: 12px 16px;
            border-radius: 12px;
            background: #f8fbff;
            cursor: pointer;
        }

        input[type="datetime-local"] {
            padding: 10px;
            border: 1px solid #ccd6e5;
            border-radius: 10px;
            font-size: 15px;
        }

        button {
            margin-top: 18px;
            background: #0b63ce;
            color: white;
            border: none;
            padding: 14px 22px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
        }

        .status {
            margin-bottom: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #e8f5e9;
            color: #1b5e20;
        }

        .error {
            background: #ffebee;
            color: #b71c1c;
        }

        a {
            color: #0b63ce;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактировать публикацию</h1>

        <p><a href="/scheduled">← Назад к очереди</a></p>

        {% if status %}
            <div class="status {{ status_type }}">{{ status }}</div>
        {% endif %}

        {% if post %}
            <form method="post" action="/scheduled/{{ post.id }}/edit">
                <textarea name="text" required>{{ post.text }}</textarea>

                <div class="platforms">
                    <label class="platform">
                        <input type="checkbox" name="platforms" value="telegram"
                            {% if "telegram" in post.platforms %}checked{% endif %}>
                        Telegram
                    </label>

                    <label class="platform">
                        <input type="checkbox" name="platforms" value="max"
                            {% if "max" in post.platforms %}checked{% endif %}>
                        MAX
                    </label>

                    <label class="platform">
                        <input type="checkbox" name="platforms" value="vk"
                            {% if "vk" in post.platforms %}checked{% endif %}>
                        VK
                    </label>
                </div>

                <div style="margin-top: 18px;">
                    <label><b>Время публикации:</b></label><br><br>
                    <input type="datetime-local" name="publish_at" value="{{ post.publish_at }}" required>
                </div>

                <button type="submit">Сохранить изменения</button>
            </form>
        {% endif %}
    </div>
</body>
</html>
